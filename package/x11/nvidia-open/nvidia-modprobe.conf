# NVIDIA driver modprobe options
# Place this file in /etc/modprobe.d/nvidia.conf
#
# Enable DRM kernel mode setting - required for proper display output,
# prevents flickering and input latency issues with compositors.
options nvidia-drm modeset=1

# Disable GSP firmware on Turing GPUs (GTX 1650 etc.) - can cause
# instability on some cards with open kernel modules.
options nvidia NVreg_EnableGpuFirmware=0

# Blacklist nouveau so the proprietary driver can load
blacklist nouveau
options nouveau modeset=0
